name: iOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build HouseMapper
        run: >-
          xcodebuild
          -project HouseMapper.xcodeproj
          -scheme HouseMapper
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test coordinate transforms
        run: >-
          xcodebuild
          -project HouseMapper.xcodeproj
          -scheme HouseMapper
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          test
